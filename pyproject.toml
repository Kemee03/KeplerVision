[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keplervision"
version = "0.1.0"
description = "An end-to-end AI pipeline for astronomical object and anomaly detection"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
cnn = ["tensorflow>=2.17,<3"]
mlops = ["mlflow>=2.14,<4"]
dvc = ["dvc>=3.50,<4"]
database = ["psycopg[binary]>=3.1,<4"]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.3,<1"]

[project.scripts]
keplervision-train = "keplervision.train:main"
keplervision-evaluate = "keplervision.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

