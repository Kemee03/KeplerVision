services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keplervision}
      POSTGRES_USER: ${POSTGRES_USER:-keplervision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kepler-local-dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keplervision} -d ${POSTGRES_DB:-keplervision}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      KEPLERVISION_MODEL_PATH: /app/models/multiscale_cnn.keras
      KEPLERVISION_MODEL_VERSION: astroLens-multiscale-cnn-v1
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-keplervision}:${POSTGRES_PASSWORD:-kepler-local-dev}@postgres:5432/${POSTGRES_DB:-keplervision}
    volumes:
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
